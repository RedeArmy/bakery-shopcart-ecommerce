# Configuración de gitleaks: se extiende la de fábrica y se acotan los falsos positivos conocidos.
title = "ShopCart gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Documented business configuration keys and the dummy password of the runner tests, which the generic API key rule mistakes for secrets"
regexes = [
  '''IdempotencyKeyHours=\d+''',
  # Valor ficticio de las pruebas unitarias de la configuración del runner; no corresponde a ninguna cuenta
  '''Abcdefg12345''',
]
