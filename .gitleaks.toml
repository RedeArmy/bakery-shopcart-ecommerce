# Configuración de gitleaks: se extiende la de fábrica y se acotan los falsos positivos conocidos.
title = "ShopCart gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Documented business configuration keys and the dummy values of the unit tests, which the generic API key rule mistakes for secrets"
regexes = [
  '''IdempotencyKeyHours=\d+''',
  # Valor ficticio de las pruebas unitarias de la configuración del runner; no corresponde a ninguna cuenta
  '''Abcdefg12345''',
  # Token de carrito de visitante ficticio de las pruebas de rutas (un UUID cualquiera): no abre nada
  '''6f1c2a34-8e0b-4a6e-9a3a-0b1f7c9d2e11''',
  # Contraseña ficticia de la prueba de configuración del banco de rendimiento (la que se lee de .env); no corresponde a ninguna cuenta
  '''FromDotEnv123''',
  # Clave de idempotencia ficticia de una prueba de sesión; ya no está en el árbol, pero sigue en el historial del PR #50 que gitleaks recorre
  '''key-12345678''',
]
