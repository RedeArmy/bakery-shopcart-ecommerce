# Borde de ShopCart: proxy hacia backend y frontend, tope grueso por IP (limit_req) y cabeceras de seguridad.
# La imagen nginx-unprivileged no puede escribir en /var: todas las rutas temporales apuntan a /tmp.
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  server_tokens off;
  # Un comprobante pesa como máximo 5 MB; el margen cubre los campos del formulario multipart
  client_max_body_size 6m;

  # Zonas de limit_req (capa de borde del rate limiting por capas, ADR-0010)
  limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  upstream backend_upstream {
    server backend:3000;
    keepalive 16;
  }

  upstream frontend_upstream {
    server frontend:8080;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    # Cabeceras de proxy comunes: se heredan en todas las ubicaciones
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
      access_log off;
      return 200 'ok';
    }

    # Autenticación: tope más estricto (refuerza el bloqueo de cuenta que vive en la base de datos)
    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend_upstream;
    }

    location /api/ {
      limit_req zone=general burst=50 nodelay;
      proxy_pass http://backend_upstream;
    }

    # El webhook de Recurrente (Fase 2) y las sondas de salud llegan al backend sin pasar por la SPA
    location /webhooks/ {
      limit_req zone=general burst=50 nodelay;
      proxy_pass http://backend_upstream;
    }

    location /health/ {
      proxy_pass http://backend_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
