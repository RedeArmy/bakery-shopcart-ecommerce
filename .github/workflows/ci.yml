# Pipeline de integración continua (Linux, más un job de humo en Windows).
# Los jobs que dependen de SQL Server están declarados pero apagados con "if: false"
# hasta que la etapa indicada los habilite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts: en CI no se instalan los hooks de husky
      - run: npm ci --ignore-scripts
      # Incluye ESLint, Prettier, cspell (en-GB), ortografía británica y sincronía de los README
      - run: npm run lint

  # Las dependencias de producción no pueden tener avisos de gravedad alta: si un aviso nuevo aparece, el pull request falla
  # en vez de esperar al grupo semanal de Dependabot. Solo lee package-lock.json, así que no instala nada.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # El cliente del frontend se genera del contrato: si alguien cambia el OpenAPI sin regenerar, falla aquí
      - run: npm run api:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Incluye la autoprueba: un fixture viola la regla a propósito y debe ser detectado
      - run: npm run arch:check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sql:lint

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .env.example tiene los secretos vacíos: basta para validar la sintaxis de compose
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.sql-test.yml config --quiet
      - run: docker compose --env-file .env.example --profile payments-sandbox --profile quality --profile observability config --quiet

  # Análisis de calidad en SonarCloud: la puerta de calidad bloquea el job si no se cumple.
  # Requiere el secreto SONAR_TOKEN y desactivar el "Automatic Analysis" del proyecto en SonarCloud.
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud necesita el historial completo para atribuir correctamente el código nuevo
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # Construye cada imagen: un Dockerfile que deja de compilar (por ejemplo, un workspace nuevo sin copiar) no pasaba por ningún job
  images:
    runs-on: ubuntu-latest
    needs: [sql-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: db-runner
            dockerfile: db/runner/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file ${{ matrix.dockerfile }} --tag shopcart-ci/${{ matrix.name }} .

  # Migra la base de pruebas, verifica el esquema y ejecuta tSQLt sobre él
  sql-tests:
    runs-on: ubuntu-latest
    needs: [sql-lint]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports: ['1433:1433']
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          # Mismo collation que la base de datos del proyecto (ADR-0025)
          MSSQL_COLLATION: Latin1_General_100_CI_AS_SC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
        env:
          MIGRATION_HOST: localhost
          MIGRATION_PORT: '1433'
          MIGRATION_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          DB_NAME: ShopCart_CI
      # db:verify va ANTES de instalar tSQLt, que nunca viaja en la base de datos entregada (ADR-0023)
      - run: npm run db:verify
        env:
          MIGRATION_HOST: localhost
          MIGRATION_PORT: '1433'
          MIGRATION_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          DB_NAME: ShopCart_CI
      - run: npm run sql:test
        env:
          SQL_TEST_HOST: localhost
          SQL_TEST_PORT: '1433'
          SQL_TEST_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
      # Carrera real entre decenas de conexiones: tSQLt corre cada prueba en una sola transacción y no puede reproducirla
      - run: npm run sql:concurrency
        env:
          SQL_TEST_HOST: localhost
          SQL_TEST_PORT: '1433'
          SQL_TEST_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
      - uses: actions/upload-artifact@v7 # spelling-ignore: nombre de la acción de terceros
        if: always()
        with:
          name: tsqlt-junit
          path: test-results/tsqlt-junit.xml
      - run: npm run sql:coverage

  # Los flujos HTTP de la API completa contra un SQL Server real, con el login de la aplicación (solo EXECUTE) como en producción
  integration:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 20
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports: ['1433:1433']
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          # Mismo collation que la base de datos del proyecto (ADR-0025)
          MSSQL_COLLATION: Latin1_General_100_CI_AS_SC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Credenciales de usar y tirar: nacen en esta ejecución, se enmascaran en el registro y no hace falta ningún secreto más
      - name: Generate the credentials of this run
        run: |
          app_password="Ci-$(openssl rand -hex 16)"
          access_secret="$(openssl rand -hex 32)"
          refresh_pepper="$(openssl rand -hex 32)"
          for value in "$app_password" "$access_secret" "$refresh_pepper"; do echo "::add-mask::$value"; done
          {
            echo "DB_APP_PASSWORD=$app_password"
            echo "JWT_ACCESS_SECRET=$access_secret"
            echo "JWT_REFRESH_PEPPER=$refresh_pepper"
          } >> "$GITHUB_ENV"
      # Con DB_APP_PASSWORD el runner crea el login de la aplicación, que la suite usa para llamar a los procedimientos
      - run: npm run db:migrate
        env:
          MIGRATION_HOST: localhost
          MIGRATION_PORT: '1433'
          MIGRATION_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          DB_NAME: ShopCart_CI
          DB_APP_USER: shopcart_app
      - run: npm run test:integration
        env:
          SQL_TEST_HOST: localhost
          SQL_TEST_PORT: '1433'
          SQL_TEST_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
          DB_NAME: ShopCart_CI
          DB_APP_USER: shopcart_app
          APP_PUBLIC_URL: http://localhost:8080

  # Recorre la aplicación completa como lo hace quien la revisa: el stack de docker compose y un navegador real. No es una
  # comprobación obligatoria (tarda y depende de un navegador), pero deja a la vista si el flujo de compra funciona de punta a punta
  e2e:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Crea el .env con secretos generados en esta ejecución, construye las imágenes y levanta todo con los datos de demostración
      - name: Start the stack
        run: npm run up
      - name: Install the browser
        run: npm exec --workspace=@shopcart/frontend -- playwright install --with-deps chromium
      - name: Run the end-to-end suite
        run: |
          password="$(grep '^SEED_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
          echo "::add-mask::$password"
          E2E_ADMIN_PASSWORD="$password" E2E_BASE_URL=http://localhost:8080 npm run test:e2e
      - name: Keep the traces and the report of a failure
        if: failure()
        uses: actions/upload-artifact@v7 # spelling-ignore: nombre de la acción de terceros
        with:
          name: e2e-failure
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color --tail 200 # spelling-ignore: opción de docker compose
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Humo en Windows: dependencias nativas (argon2) y checksum con fin de línea CRLF
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      # Los archivos de tSQLt llevan CRLF y se guardan sin conversión: en Windows (autocrlf activo) deben conservar sus checksums
      - run: npm run sql:lint
      # Incluye la prueba de que el checksum del runner no cambia entre CRLF y LF
      - run: npm run test --workspace=@shopcart/db-runner
