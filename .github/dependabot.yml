# Actualizaciones semanales agrupadas para no saturar la revisión
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Los cambios mayores rompieron main dos veces (el par de vitest y @eslint/js): se hacen a mano, con pruebas
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
  - package-ecosystem: docker
    directory: /db/runner
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
