# SonarCloud: análisis desde GitHub Actions (job "sonarcloud" de .github/workflows/ci.yml).
# La organización y la clave salen de la importación del repositorio en sonarcloud.io; verifíquelas allí.
sonar.organization=redearmy
sonar.projectKey=RedeArmy_bakery-shopcart-ecommerce
sonar.projectName=ShopCart

# Código de producción y pruebas por separado: SonarCloud no admite que se solapen
sonar.sources=backend/src,frontend/src,tools/scripts,db/lint,db/runner/src,tools/recurrente-simulator/src
sonar.tests=backend/tests,frontend/tests,tools/scripts/tests,db/runner/tests,tools/recurrente-simulator/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,tools/scripts/arch-fixtures/**,tools/scripts/tests/**
sonar.sourceEncoding=UTF-8

# Informes de cobertura generados por "npm run test:coverage"
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info,tools/scripts/coverage/lcov.info

# Puntos de entrada y marcadores sin lógica propia no cuentan para la cobertura
sonar.coverage.exclusions=**/*.test.ts,**/index.ts,backend/src/main.ts,frontend/src/main.tsx,tools/scripts/*.ts,db/lint/*.ts,db/runner/src/**,tools/recurrente-simulator/src/**
