# SonarQube (perfil "quality" de docker compose): análisis opcional que no bloquea la entrega
sonar.projectKey=shopcart
sonar.projectName=ShopCart
sonar.sources=backend/src,frontend/src,db,tools/scripts
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,tools/scripts/arch-fixtures/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
