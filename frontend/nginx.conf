# Servidor estático de la SPA: cualquier ruta desconocida devuelve index.html para que decida React Router
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Los archivos con hash en el nombre pueden cachearse sin límite
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
