# Servidor estático de la SPA: cualquier ruta desconocida devuelve index.html para que decida React Router
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Los archivos con hash en el nombre pueden cachearse sin límite
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html apunta a los archivos con hash de la versión vigente: si el navegador lo guarda, sigue mostrando la versión
  # anterior tras un despliegue. `no-cache` obliga a preguntar al servidor, que contesta 304 si nada cambió.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
