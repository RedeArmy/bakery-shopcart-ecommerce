        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_asc
              - price_desc
              - newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
