          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/variants/{id}/price:
    patch:
      tags:
        - Catalogue
      summary: Change the price; the previous value stays in the audit log
      operationId: adminChangePrice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idVariant:
                    $ref: '#/components/schemas/Id'
                  price:
                    $ref: '#/components/schemas/MoneyText'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Current cart with totals computed by the database
      operationId: getCart
      security:
        - {}
        - bearerAuth: []
      parameters:
        - &a1
          $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/cart/items/{variantId}:
    put:
      tags:
        - Cart
      summary: Set the quantity of a variant
      operationId: setCartItem
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - *a1
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
