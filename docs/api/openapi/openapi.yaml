# Contrato de la API de ShopCart (fuente de verdad, ADR-0011).
# Las rutas de negocio se añaden primero aquí (contract first); backend/tests/unit/openapi.test.ts comprueba que este archivo
# y las rutas de Express describen exactamente las mismas operaciones.
openapi: 3.0.3
info:
  title: ShopCart API
  version: 0.2.0
  description: E-commerce API for the Dulce Aroma bakery. Amounts are decimal strings with two decimals (never JSON numbers) and the currency is always GTQ. Errors share a single shape. Every mutating endpoint needs an Idempotency-Key header; PUT and DELETE accept it optionally. Delivery Phase 1 covers deposits; card payments and the webhook arrive in Phase 2.
servers:
  - url: /
    description: Same origin as the web application (nginx proxies /api and /health)
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Authentication
    description: 'Accounts and sessions. Login, refresh and logout take no Idempotency-Key: they use rate limiting, lockout and token rotation.'
  - name: Catalogue
    description: Public catalogue and its administration
  - name: Cart
    description: Visitor (X-Cart-Token) or customer cart. Quantities are absolute, so repeating a request is harmless.
  - name: Addresses
    description: Own delivery addresses only
  - name: Checkout
    description: 'Reservation and order creation. The client never sends an amount: the database prices everything.'
  - name: Orders
    description: Orders of the signed-in customer; staff use /admin/orders
  - name: Payments
    description: Bank deposits, proofs, review and refunds. Card payments arrive in Delivery Phase 2.
  - name: Inventory
    description: Stock movements; only an administrator moves stock
  - name: Coupons
    description: Coupon administration
  - name: Users
    description: Accounts are deactivated, never deleted
  - name: Audit
    description: Immutable audit log and system versions
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: The process is running. It does not touch dependencies.
      operationId: getLiveness
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: The database is reachable and the schema version is current.
      operationId: getReadiness
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Create a customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idUser:
                    $ref: '#/components/schemas/Id'
                required:
                  - idUser
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in
      description: The same 401 answers a wrong password and an unknown email. A locked account answers 423 without checking the password.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate the refresh token
      description: Reusing a rotated token revokes its whole family (REFRESH_TOKEN_REUSED).
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the refresh token family
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Own profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/categories:
    get:
      tags:
        - Catalogue
      summary: Category tree
      operationId: listCategories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/products:
    get:
      tags:
        - Catalogue
      summary: Search products
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          description: Text in the name or description
          schema:
            type: string
        - name: category
          in: query
          description: Includes the subcategories
          schema:
            $ref: '#/components/schemas/Id'
        - name: min
          in: query
          schema:
            $ref: '#/components/schemas/MoneyText'
        - name: max
          in: query
          schema:
            $ref: '#/components/schemas/MoneyText'
        - name: available
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_asc
              - price_desc
              - newest
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  page:
                    type: integer
                    minimum: 1
                  size:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                required:
                  - items
                  - page
                  - size
                  - total
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/products/{id}:
    get:
      tags:
        - Catalogue
      summary: Product with its variants and images
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/categories:
    get:
      tags:
        - Catalogue
      summary: All categories, including inactive ones
      operationId: adminListCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Catalogue
      summary: Create a category
      operationId: adminCreateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idCategory:
                    $ref: '#/components/schemas/Id'
                required:
                  - idCategory
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/categories/{id}:
    put:
      tags:
        - Catalogue
      summary: Edit a category
      operationId: adminUpdateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idCategory:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Catalogue
      summary: Deactivate a category
      operationId: adminDeactivateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idCategory:
                    $ref: '#/components/schemas/Id'
                  isActive:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/products:
    get:
