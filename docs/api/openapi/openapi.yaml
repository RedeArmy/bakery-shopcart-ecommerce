components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical operation (8 to 64 letters, digits, hyphens or underscores). Repeating it replays the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional here (PUT and DELETE are idempotent by semantics); honoured when present.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: UUID chosen by the browser for a visitor cart
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failed, or a mandatory header is missing
      content: &a2
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorised:
      description: Missing or expired access token
      content: *a2
    Forbidden:
      description: The role is not allowed to perform this action
      content: *a2
    NotFound:
      description: The resource does not exist or does not belong to the caller
      content: *a2
    Conflict:
      description: Conflict with the current state (out of stock, request in progress, duplicate)
      content: *a2
    Unprocessable:
      description: A business rule refused the request, or the idempotency key was reused with another body
      content: *a2
    PayloadTooLarge:
      description: The file is above 5 MB
      content: *a2
    UnsupportedMedia:
      description: The file is not a JPEG, a PNG or a PDF
      content: *a2
    Locked:
      description: The account is temporarily locked after repeated failed sign-ins; details.lockedUntil says until when
      content: *a2
    Unavailable:
      description: A dependency is unavailable or the schema is outdated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Readiness'
    TooManyRequests:
      description: Rate limit exceeded; see the Retry-After header
      headers:
        Retry-After:
          schema:
            type: integer
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content: *a2
  schemas:
    Readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
            schema:
              type: string
              enum:
                - ok
                - outdated
                - unknown
          required:
            - database
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: Stable SCREAMING_SNAKE_CASE code in British English
              example: PAYMENT_METHOD_UNAVAILABLE
            message:
              type: string
              description: Short English message for developers
            details:
              description: Optional structured details such as validation issues
            requestId:
              type: string
    MoneyText:
      type: string
      pattern: ^\d{1,16}\.\d{2}$
      example: '145.00'
    Id:
      type: integer
      minimum: 1
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          minLength: 10
          maxLength: 128
        fullName:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 20
          nullable: true
      required:
        - email
        - password
        - fullName
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UserProfile:
      type: object
      properties:
        idUser:
          $ref: '#/components/schemas/Id'
        role:
          type: string
          enum:
            - Customer
            - Operator
            - Administrator
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
      required:
        - idUser
        - role
        - email
        - fullName
        - isActive
    Session:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds of life of the access token
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
    CategoryNode:
      type: object
      properties:
        idCategory:
          $ref: '#/components/schemas/Id'
        idParentCategory:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        activeProducts:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
      required:
        - idCategory
        - name
        - children
    Category:
      type: object
      properties:
        idCategory:
          $ref: '#/components/schemas/Id'
        idParentCategory:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        activeProducts:
          type: integer
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
          nullable: true
        parentId:
          type: integer
          nullable: true
      required:
        - name
    ProductSummary:
      type: object
      properties:
        idProduct:
          $ref: '#/components/schemas/Id'
        idCategory:
          $ref: '#/components/schemas/Id'
        categoryName:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        leadTimeDays:
          type: integer
        isActive:
          type: boolean
        primaryImageUrl:
          type: string
          nullable: true
        minPrice:
          $ref: '#/components/schemas/MoneyText'
        maxPrice:
          $ref: '#/components/schemas/MoneyText'
        available:
          type: integer
      required:
        - idProduct
        - name
        - minPrice
        - maxPrice
    Variant:
      type: object
      properties:
        idVariant:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        price:
          $ref: '#/components/schemas/MoneyText'
        onHandStock:
          type: integer
        isActive:
          type: boolean
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
      required:
        - idVariant
        - sku
        - price
    ProductDetail:
      type: object
      properties:
        idProduct:
          $ref: '#/components/schemas/Id'
        idCategory:
          $ref: '#/components/schemas/Id'
        categoryName:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        leadTimeDays:
          type: integer
        isActive:
          type: boolean
        images:
          type: array
          items:
            type: object
            properties:
              idProductImage:
                type: integer
              url:
                type: string
              sortOrder:
                type: integer
              isPrimary:
                type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
      required:
        - idProduct
        - name
        - variants
    ProductRequest:
      type: object
      properties:
        categoryId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 1000
          nullable: true
        leadTimeDays:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
        rowVersion:
          type: string
          description: Base64 version read earlier; a stale edit is rejected
          nullable: true
      required:
        - categoryId
        - name
    VariantCreateRequest:
      type: object
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
          maxLength: 40
        price:
          $ref: '#/components/schemas/MoneyText'
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
            required:
              - name
              - value
          nullable: true
      required:
        - productId
        - sku
        - price
    VariantUpdateRequest:
      type: object
      properties:
        sku:
          type: string
          maxLength: 40
        isActive:
          type: boolean
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
            required:
              - name
              - value
          nullable: true
      required:
        - sku
        - isActive
    PriceRequest:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/MoneyText'
      required:
        - price
    CartLine:
      type: object
      properties:
        idCartItem:
          type: integer
        idVariant:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        inscription:
          type: string
          nullable: true
        unitPrice:
          $ref: '#/components/schemas/MoneyText'
        lineTotal:
          $ref: '#/components/schemas/MoneyText'
        available:
          type: integer
        isAvailable:
          type: boolean
      required:
        - idVariant
        - quantity
